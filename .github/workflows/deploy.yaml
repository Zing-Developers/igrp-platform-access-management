name: Deploy

on:
  push:
    branches:
      - cloud-dev
    paths-ignore:
      - 'k8s/**'
      - '.gitattributes'

env:
  DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/1425673583837053140/EI5l4JbtOFm3bQ8c8HG984ePvodVzuQeBQMGKJAFA2jtcooOPYXRCFHfE7rojeuxz7hT
  REPO_NAME: ${{ github.repository }}
  BRANCH_NAME: ${{ github.ref_name }}
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  ROLE_ID: "1422917237320450048"
  SERVER_IP: "46.62.156.35"
  K8S_NAMESPACE: igrp-process-studio-backend
  K8S_DEPLOYMENT_NAME: igrp-process-studio-backend
  DOCKER_REGISTRY_ENV: dev
  DOCKER_HUB_IMAGE_TAG: igrp-process-studio-backend-api

jobs:
  build_and_push: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker  # Switching to the Docker driver

      - name: Add custom CA certificate
        run: |
          echo "${{ secrets.DOCKER_REPO_CERT }}" | sudo tee /etc/ssl/certs/repo-ca.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/docker-repo.zingaistudio.com
          sudo cp /etc/ssl/certs/repo-ca.crt /etc/docker/certs.d/docker-repo.zingaistudio.com/ca.crt
          sudo systemctl restart docker


      - name: Login to Nexus Sonatype
        uses: docker/login-action@v3
        with:
          username: admin
          password: nexusadmin 
          registry: docker-repo.zingaistudio.com

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: | 
            docker-repo.zingaistudio.com/irn/igrp-access-management-dev:latest

  
